name: Release

# Builds and publishes desktop bundles when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# Artifacts are unsigned (no code-signing certificates yet — see the
# release notes); Windows SmartScreen and macOS Gatekeeper will warn.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "axomail ${{ github.ref_name }}"
          releaseBody: |
            Pre-alpha build of axomail — a fast, lightweight, open-source
            desktop mail client built with Tauri 2, Rust, and Vue 3.

            This build reaches broad feature parity with a desktop mail
            client: two-way IMAP sync (CONDSTORE/QRESYNC) with IDLE push,
            POP3, SMTP; OAuth2/XOAUTH2 (Gmail, Microsoft 365) alongside
            password auth; multiple accounts, identities, folder
            management, tags, and a unified inbox; reply/reply-all/forward
            with a rich-text composer, attachments, and server-side Sent
            copies; a virtualized threaded message list with quick filters
            and full-text search plus a saved-search builder; move / copy /
            archive / delete-to-Trash with undo and Empty Trash; an address
            book with autocomplete, message filters, a Bayesian junk filter,
            iCalendar invitations, OpenPGP sign/verify/encrypt/decrypt, an
            offline store with "Work Offline", a command palette with
            keyboard shortcuts, mbox import/export, printing, and full
            English + German localization.

            New in this release: a refreshed interface with icons, subtle
            animations and a polished dark mode, a fourth "Focus" layout
            without the folder pane, and panes that can be rearranged by
            dragging. It also updates ammonia and rustls to fix published
            security advisories.

            **These bundles are unsigned.** Windows SmartScreen and macOS
            Gatekeeper will warn on first launch; on macOS use
            right-click → Open. Linux builds ship as AppImage/deb/rpm.

            All mail data stays local; credentials and PGP secret keys live
            only in the OS keychain, and no telemetry is collected. It has
            not yet been hardened against real-world servers at scale —
            expect rough edges. See the README for the current feature
            state and known limitations.
          releaseDraft: false
          prerelease: true
