name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check the roadmap in
        `docs/architecture/` — calendar, contacts, cloud sync, AI
        features, and mobile apps are explicitly out of scope for now,
        and the project's priority order (correctness > security >
        speed > memory > offline > usability > features) is binding.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that axomail makes hard?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
