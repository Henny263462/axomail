[workspace]
resolver = "3"
members = [
    "apps/desktop/src-tauri",
    "crates/mail-core",
    "crates/mail-imap",
    "crates/mail-pop3",
    "crates/mail-smtp",
    "crates/mail-sync",
    "crates/mail-storage",
    "crates/mail-parser",
    "crates/mail-security",
    "crates/mail-test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Minimum supported Rust version. Also documented in README.md.
rust-version = "1.95"
license = "MIT"
authors = ["axomail contributors"]

[workspace.dependencies]
# Versions verified against crates.io on 2026-07-18 (see ADR-0002).
tauri = { version = "2.11.5", features = [] }
tauri-build = { version = "2.6.3", features = [] }
# Desktop notifications for background/manual sync (phase 4). Only the
# aggregated "N new messages" count is ever shown — no subjects or senders.
tauri-plugin-notification = "2.3.3"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.0", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "io-util",
    "net",
    "fs",
] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }
# The `v1` feature selects the platform stores: Windows Credential
# Manager, macOS Keychain, and the Linux Secret Service (zbus).
keyring = { version = "4.1.5", features = ["v1"] }
tracing = "0.1.44"
tempfile = "3"
# Linear-time regular expressions for user-supplied message-filter patterns
# (Track 4.2). The `regex` engine has no catastrophic backtracking, so an
# arbitrary user pattern is ReDoS-safe. Already present transitively in the
# lock; pinned to the resolved version. MIT/Apache-2.0. Verified against
# crates.io on 2026-07-20.
regex = "1.13.1"

# Phase 2+ protocol and content stack (ADR-0006).
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
mail-send = { version = "0.6.1", default-features = false, features = [
    "ring",
    "tls12",
    "cram-md5",
    "builder",
] }
mail-builder = "0.4.4"
mail-parser = "0.11.5"
ammonia = "4.1.3"
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.9"
tokio-util = "0.7.18"
futures = "0.3"
# Test-only: self-signed certificates for the local TLS test servers.
rcgen = "0.14.8"

# OAuth2 / autoconfig prerequisites (Wave 1 Stage 0 + Track 1.2, ADR-0009).
# Versions verified against crates.io on 2026-07-19.
# HTTPS client for the OAuth2 token exchange (Track 1.2) and later ISPDB
# autoconfig (5.3). `rustls-no-provider` selects rustls without bundling a
# crypto provider, so the process installs `ring` as the default
# `CryptoProvider` and reqwest reuses the workspace rustls 0.23 / ring stack —
# no aws-lc-rs, no native-tls. It shares the same rustls-platform-verifier
# already pulled by mail-send (SMTP). reqwest 0.13.4 also matches the version
# tauri already resolves, so no duplicate reqwest enters the lock. `form` adds
# the `application/x-www-form-urlencoded` token-exchange request bodies.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json", "form"] }
# XOAUTH2 SASL string construction for IMAP/SMTP and the PKCE base64 lines (Track 1.2).
base64 = "0.22.1"
# ring supplies the CSPRNG (PKCE verifier + CSRF state) and SHA-256 (the PKCE
# S256 challenge). It is already the rustls crypto provider in the tree, so
# this adds no new graph dependency. Version pinned to the resolved one.
ring = "0.17.14"
# Opens the OAuth2 consent URL in the system browser (RFC 8252 external agent).
tauri-plugin-opener = "2.5.4"

# Attachment file dialogs + disk IO (Wave 3 Stage 0, ADR-0010). Versions
# verified against crates.io on 2026-07-19; both are from the tauri-apps
# plugins-workspace (like tauri-plugin-opener) and resolve against tauri
# 2.11.5 without bumping it. `dialog` supplies the native open/save-file
# pickers; `fs` is registered so its (default-denied) command surface exists,
# but the default capability grants it **no** scope — attachment reads/writes
# run in Rust `std::fs` commands against a dialog-chosen path, never through the
# webview fs API (see ADR-0010). No extra features are enabled.
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"

# OpenPGP (Wave 5 Stage 0, ADR-0015). rPGP is a pure-Rust OpenPGP
# implementation built on the RustCrypto crates; it has NO nettle/GPG backend,
# so there is no GPL/LGPL crypto to exclude (that is the sequoia concern, not
# rPGP's). `default-features = false` drops the single default feature `bzip2`,
# which pulls the C `bzip2`/`bzip2-sys` binding — non-pure-Rust and an extra
# build-time C toolchain dependency for BZIP2-compressed PGP packets we do not
# need (ZIP/ZLIB via the pure-Rust flate2 stay available). This gives the
# minimal pure-Rust feature set for sign/verify/encrypt/decrypt. Secret key
# material lives in the OS keychain (ADR-0001), never the crate's on-disk form.
# Track 5.1 adds the PGP module in `crates/mail-security`; the dep is declared
# now so its whole resolved graph is cargo-deny-vetted once, ahead of fan-out.
# Version 0.20.0 verified against crates.io on 2026-07-20 (MIT OR Apache-2.0).
pgp = { version = "0.20.0", default-features = false }
# CSPRNG for OpenPGP key generation and per-message session keys (Track 5.1).
# rPGP's key-gen / encrypt / sign APIs all take an `impl rand::Rng + CryptoRng`;
# `rand` 0.8 is exactly the version rPGP itself uses (it re-exports the same
# `rand_core` 0.6 `CryptoRng` bound), so this pins to the version already in the
# resolved graph and introduces no new transitive tree. MIT OR Apache-2.0,
# verified against crates.io on 2026-07-20. Only `mail-security` uses it.
rand = "0.8"

# Internal crates. Directory names follow the architecture layout; package
# names carry the `axomail-` prefix to avoid clashes with public crates
# (e.g. the external `mail-parser` crate). See ADR-0002.
axomail-core = { path = "crates/mail-core" }
axomail-imap = { path = "crates/mail-imap" }
axomail-pop3 = { path = "crates/mail-pop3" }
axomail-smtp = { path = "crates/mail-smtp" }
axomail-sync = { path = "crates/mail-sync" }
axomail-storage = { path = "crates/mail-storage" }
axomail-parser = { path = "crates/mail-parser" }
axomail-security = { path = "crates/mail-security" }
axomail-test-support = { path = "crates/mail-test-support" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
# Production paths must not panic on expectable errors. Test modules may
# opt out locally with `#![allow(clippy::unwrap_used)]`.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
# Favor small binaries; revisit with measurements in docs/performance/.
codegen-units = 1
lto = "thin"
strip = "symbols"
