# cargo-deny configuration.
# License policy: MIT-compatible licenses only (see project conventions).

[graph]
all-features = true

[advisories]
yanked = "deny"
# All entries below are `unmaintained` notices, not vulnerabilities.
# They are unavoidable transitive dependencies of the Tauri 2 stack.
# Reviewed 2026-07-18; re-check on every Tauri upgrade.
ignore = [
    # GTK3 bindings: required by wry/tao on Linux until the ecosystem
    # completes the WebKitGTK 6 / GTK4 migration.
    { id = "RUSTSEC-2024-0411", reason = "gtk3-rs unmaintained; pulled in by tauri's Linux stack (wry/tao)" },
    { id = "RUSTSEC-2024-0412", reason = "gtk3-rs unmaintained; pulled in by tauri's Linux stack (wry/tao)" },
    { id = "RUSTSEC-2024-0413", reason = "gtk3-rs unmaintained; pulled in by tauri's Linux stack (wry/tao)" },
    { id = "RUSTSEC-2024-0414", reason = "gtk3-rs unmaintained; pulled in by tauri's Linux stack (wry/tao)" },
    { id = "RUSTSEC-2024-0415", reason = "gtk3-rs unmaintained; pulled in by tauri's Linux stack (wry/tao)" },
    { id = "RUSTSEC-2024-0416", reason = "gtk3-rs unmaintained; pulled in by tauri's Linux stack (wry/tao)" },
    { id = "RUSTSEC-2024-0417", reason = "gtk3-rs unmaintained; pulled in by tauri's Linux stack (wry/tao)" },
    { id = "RUSTSEC-2024-0418", reason = "gtk3-rs unmaintained; pulled in by tauri's Linux stack (wry/tao)" },
    { id = "RUSTSEC-2024-0419", reason = "gtk3-rs unmaintained; pulled in by tauri's Linux stack (wry/tao)" },
    { id = "RUSTSEC-2024-0420", reason = "gtk3-rs unmaintained; pulled in by tauri's Linux stack (wry/tao)" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained; transitive via the GTK bindings" },
    # unic-* crates: build-time transitive dependencies of tauri-codegen.
    { id = "RUSTSEC-2025-0075", reason = "unic-* unmaintained; build-time transitive of tauri-codegen" },
    { id = "RUSTSEC-2025-0080", reason = "unic-* unmaintained; build-time transitive of tauri-codegen" },
    { id = "RUSTSEC-2025-0081", reason = "unic-* unmaintained; build-time transitive of tauri-codegen" },
    { id = "RUSTSEC-2025-0098", reason = "unic-* unmaintained; build-time transitive of tauri-codegen" },
    { id = "RUSTSEC-2025-0100", reason = "unic-* unmaintained; build-time transitive of tauri-codegen" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
