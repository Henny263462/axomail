[package]
name = "axomail-desktop"
description = "axomail desktop application shell (Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
# Unique lib name to avoid bin/lib artifact clashes on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "axomail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }

[lints]
workspace = true
