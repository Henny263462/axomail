[package]
name = "axomail-desktop"
description = "axomail desktop application shell (Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
# Unique lib name to avoid bin/lib artifact clashes on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "axomail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
axomail-core = { workspace = true }
axomail-storage = { workspace = true }
axomail-security = { workspace = true }
axomail-imap = { workspace = true }
axomail-pop3 = { workspace = true }
axomail-smtp = { workspace = true }
axomail-sync = { workspace = true }
axomail-parser = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# OAuth2 / XOAUTH2 (ADR-0009): HTTP token exchange, PKCE, and the process-wide
# rustls crypto provider installed at startup.
reqwest = { workspace = true }
base64 = { workspace = true }
ring = { workspace = true }
rustls = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
axomail-test-support = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
